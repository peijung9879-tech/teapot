<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫砂茶壺藏品錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#eee3ce;
    --paper-deep:#e4d5b8;
    --ink:#241c16;
    --ink-soft:#4a3d33;
    --clay:#5f3a2e;
    --clay-deep:#42241c;
    --clay-light:#8a5a41;
    --seal:#9c2b26;
    --seal-deep:#7a1f1c;
    --line: rgba(36,28,22,0.18);
    --card:#f5ecd9;
    --shadow: 0 10px 30px rgba(36,20,12,0.18);
    --serif: 'Noto Serif TC', 'PMingLiU', serif;
    --sans: 'Noto Sans TC', 'PingFang TC', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(95,58,46,0.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(156,43,38,0.06), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  .texture{
    position:fixed; inset:0; pointer-events:none; opacity:0.5; mix-blend-mode:multiply;
    background-image:
      repeating-linear-gradient(0deg, rgba(36,28,22,0.02) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(36,28,22,0.015) 0px, transparent 1px, transparent 3px);
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:36px 24px 80px; position:relative; }

  header.top{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding-bottom:28px; margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:var(--sans); letter-spacing:0.5em; font-size:11px; color:var(--clay);
    text-transform:uppercase; margin-bottom:14px;
  }
  h1.title{
    font-family:var(--serif); font-weight:900; font-size:clamp(32px,5vw,52px);
    margin:0; color:var(--clay-deep); letter-spacing:0.06em;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.25);
  }
  .subtitle{
    font-family:var(--serif); font-size:15px; color:var(--ink-soft); margin-top:12px;
    letter-spacing:0.08em;
  }

  nav.tabs{
    display:flex; gap:10px; justify-content:center; margin:28px 0 30px;
  }
  .tab-btn{
    font-family:var(--serif); font-size:16px; letter-spacing:0.15em;
    background:transparent; border:1px solid var(--clay); color:var(--clay-deep);
    padding:10px 26px; cursor:pointer; border-radius:2px;
    transition:all .25s ease; position:relative;
  }
  .tab-btn.active{ background:var(--clay-deep); color:var(--paper); border-color:var(--clay-deep); box-shadow:var(--shadow); }
  .tab-btn:not(.active):hover{ background:rgba(95,58,46,0.08); }

  .toolbar{
    display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .search-box{
    flex:1; min-width:220px; position:relative;
  }
  .search-box input{
    width:100%; font-family:var(--sans); font-size:14px; padding:11px 16px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:2px; outline:none; transition:border-color .2s;
  }
  .search-box input:focus{ border-color:var(--clay); }
  .count-tag{
    font-family:var(--serif); font-size:13px; color:var(--ink-soft); white-space:nowrap;
    border:1px solid var(--line); padding:9px 16px; border-radius:2px; background:var(--card);
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:3px;
    overflow:hidden; cursor:pointer; position:relative;
    transition:transform .25s ease, box-shadow .25s ease;
    display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
  .card .seal{
    position:absolute; top:0; right:0; z-index:2;
    min-width:34px; height:30px; padding:0 8px; border:1px solid var(--seal); color:var(--seal);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:13px; letter-spacing:0.02em;
    background:var(--card); border-radius:0 0 0 3px; border-top:none; border-right:none;
  }
  .card .photo{
    width:100%; aspect-ratio:1/1; background:#d9c9a8; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .card .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card .photo.empty{ color:var(--clay-light); font-family:var(--serif); font-size:13px; }
  .card .meta{ padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; gap:4px; }
  .card .name{ font-family:var(--serif); font-size:17px; font-weight:600; color:var(--clay-deep); line-height:1.4; }
  .card .author{ font-family:var(--sans); font-size:12.5px; color:var(--ink-soft); }
  .card .era{ font-family:var(--sans); font-size:11.5px; color:var(--clay-light); letter-spacing:0.05em; }
  .card .badge-new{
    font-size:10px; letter-spacing:0.1em; color:var(--seal); border:1px solid var(--seal);
    display:inline-block; padding:2px 7px; border-radius:2px; margin-top:6px; width:fit-content;
  }

  .empty-state{
    text-align:center; padding:70px 20px; font-family:var(--serif); color:var(--ink-soft);
  }

  /* Modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(24,16,10,0.72); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    background:var(--paper); max-width:760px; width:100%; max-height:88vh; overflow:auto;
    border-radius:4px; box-shadow:0 30px 60px rgba(0,0,0,0.4); position:relative;
    border:1px solid var(--line);
  }
  .modal-close{
    position:absolute; top:14px; right:14px; background:var(--clay-deep); color:var(--paper);
    border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;
    z-index:3;
  }
  .modal-photos{ display:flex; gap:2px; overflow-x:auto; background:#d9c9a8; }
  .modal-photos img{ width:100%; max-height:360px; object-fit:contain; background:#d9c9a8; flex-shrink:0; }
  .modal-photos.single img{ width:100%; }
  .modal-body{ padding:26px 30px 34px; }
  .modal-id{ font-family:var(--serif); color:var(--seal); font-size:13px; letter-spacing:0.15em; margin-bottom:6px;}
  .modal-name{ font-family:var(--serif); font-size:26px; font-weight:700; color:var(--clay-deep); margin:0 0 14px; }
  .modal-row{ display:flex; gap:10px; font-size:14px; margin-bottom:8px; }
  .modal-row .lbl{ color:var(--clay); font-family:var(--serif); min-width:56px; flex-shrink:0;}
  .modal-row .val{ color:var(--ink-soft); white-space:pre-wrap; line-height:1.7;}

  /* Add form */
  .form-card{
    max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--line);
    border-radius:4px; padding:34px 34px 30px; box-shadow:var(--shadow);
  }
  .form-title{ font-family:var(--serif); font-size:22px; color:var(--clay-deep); margin:0 0 6px; }
  .form-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:26px; line-height:1.6; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-family:var(--serif); font-size:13.5px; color:var(--clay-deep); margin-bottom:6px; letter-spacing:0.04em;}
  .field input[type=text], .field textarea{
    width:100%; font-family:var(--sans); font-size:14px; padding:10px 14px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:2px;
    outline:none; transition:border-color .2s;
  }
  .field input[type=text]:focus, .field textarea:focus{ border-color:var(--clay); }
  .field textarea{ min-height:90px; resize:vertical; font-family:var(--sans); }
  .photo-drop{
    border:1.5px dashed var(--clay-light); border-radius:3px; padding:20px; text-align:center;
    cursor:pointer; font-size:13px; color:var(--ink-soft); background:var(--paper);
    transition:border-color .2s, background .2s;
  }
  .photo-drop:hover{ border-color:var(--clay); background:rgba(95,58,46,0.05); }
  .photo-preview{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .photo-preview .thumb{ position:relative; width:72px; height:72px; border-radius:2px; overflow:hidden; border:1px solid var(--line);}
  .photo-preview .thumb img{ width:100%; height:100%; object-fit:cover; }
  .photo-preview .thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(24,16,10,0.7); color:#fff; border:none;
    width:18px; height:18px; border-radius:50%; font-size:11px; cursor:pointer; line-height:1;
  }
  .submit-btn{
    width:100%; padding:13px; margin-top:8px; background:var(--clay-deep); color:var(--paper);
    border:none; font-family:var(--serif); font-size:15px; letter-spacing:0.12em; border-radius:2px;
    cursor:pointer; transition:background .2s;
  }
  .submit-btn:hover{ background:var(--seal-deep); }
  .submit-btn:disabled{ opacity:0.55; cursor:not-allowed; }
  .form-msg{ text-align:center; font-size:13px; margin-top:12px; min-height:18px; }
  .form-msg.ok{ color:#3d6b3a; }
  .form-msg.err{ color:var(--seal); }

  .manage-list{ max-width:640px; margin:26px auto 0; }
  .manage-item{
    display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:2px; margin-bottom:8px; font-size:13px;
  }
  .manage-item img{ width:38px; height:38px; object-fit:cover; border-radius:2px; flex-shrink:0; }
  .manage-item .mi-name{ flex:1; font-family:var(--serif); color:var(--clay-deep); }
  .manage-item button{
    background:none; border:1px solid var(--seal); color:var(--seal); font-size:11px;
    padding:5px 10px; border-radius:2px; cursor:pointer;
  }
  .manage-item button:hover{ background:var(--seal); color:#fff; }

  footer{ text-align:center; margin-top:60px; font-size:11.5px; color:var(--clay-light); letter-spacing:0.08em; }

  @media (max-width:520px){
    .wrap{ padding:24px 14px 60px; }
    .form-card{ padding:26px 20px 24px; }
  }
</style>
</head>
<body>
<div class="texture"></div>
<div class="wrap">
  <header class="top">
    <h1 class="title">紫砂茶壺藏品錄</h1>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="gallery">總覽藏品</button>
    <button class="tab-btn" data-tab="add">新增藏品</button>
  </nav>

  <section id="tab-gallery">
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜尋品名、作者或年代…">
      </div>
      <div class="count-tag" id="countTag">共 0 件</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">沒有符合的藏品</div>
  </section>

  <section id="tab-add" style="display:none;">
    <div class="form-card">
      <div class="form-title">新增藏品</div>
      <div class="form-sub">照片會自動壓縮以利儲存。</div>
      <div class="form-sub" id="cloudStatus" style="margin-top:-14px;"></div>
      <form id="addForm">
        <div class="field">
          <label>品名</label>
          <input type="text" id="f_name" placeholder="例如：仿古扁腹壺" required>
        </div>
        <div class="field">
          <label>作者</label>
          <input type="text" id="f_author" placeholder="例如：馮桂林">
        </div>
        <div class="field">
          <label>年代</label>
          <input type="text" id="f_era" placeholder="例如：清朝中期">
        </div>
        <div class="field">
          <label>備註 / 說明</label>
          <textarea id="f_note" placeholder="作者簡介、來源、備註…"></textarea>
        </div>
        <div class="field">
          <label>照片</label>
          <div class="photo-drop" id="photoDrop">點擊或拖曳上傳照片（最多 2 張）</div>
          <input type="file" id="f_photo" accept="image/*" multiple style="display:none;">
          <div class="photo-preview" id="photoPreview"></div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">加入藏品錄</button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </div>

    <div class="manage-list" id="manageList"></div>

    <div style="max-width:640px;margin:22px auto 0;text-align:center;">
      <button type="button" id="exportBtn" class="submit-btn" style="background:var(--clay);">📥 匯出目前全部資料成 Excel</button>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6;" id="exportHint"></div>
    </div>
  </section>

  <footer>紫砂茶壺藏品錄 · 資料以本機雲端儲存</footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-photos" id="modalPhotos"></div>
    <div class="modal-body">
      <div class="modal-id" id="modalId"></div>
      <h2 class="modal-name" id="modalName"></h2>
      <div class="modal-row" id="row-author"><div class="lbl">作者</div><div class="val" id="modalAuthor"></div></div>
      <div class="modal-row" id="row-era"><div class="lbl">年代</div><div class="val" id="modalEra"></div></div>
      <div class="modal-row" id="row-note"><div class="lbl">說明</div><div class="val" id="modalNote"></div></div>
    </div>
  </div>
</div>

let customItems = [];
let allItems = [];

function renderGrid(list){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countTag').textContent = `共 ${list.length} 件`;
  if(list.length===0){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = list.map(it=>{
    const img = it.images && it.images[0];
    const photoHtml = img
      ? `<div class="photo"><img src="${img}" loading="lazy" alt="${escapeHtml(it.name)}"></div>`
      : `<div class="photo empty">尚無照片</div>`;
    return `<div class="card" data-id="${it.uid}">
      <div class="seal">${it.id}</div>
      ${photoHtml}
      <div class="meta">
        <div class="name">${escapeHtml(it.name || '（未命名）')}</div>
        ${it.author ? `<div class="author">${escapeHtml(it.author)}</div>` : ''}
        ${it.era ? `<div class="era">${escapeHtml(it.era)}</div>` : ''}
        ${it.isCustom ? '<div class="badge-new">新增</div>' : ''}
      </div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openModal(card.dataset.id));
  });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(uid){
  const it = allItems.find(x=>x.uid===uid);
  if(!it) return;
  document.getElementById('modalId').textContent = `第 ${it.id} 號`;
  document.getElementById('modalName').textContent = it.name || '（未命名）';
  const setRow = (rowId,valId,val)=>{
    document.getElementById(rowId).style.display = val ? 'flex' : 'none';
    document.getElementById(valId).textContent = val || '';
  };
  setRow('row-author','modalAuthor', it.author);
  setRow('row-era','modalEra', it.era);
  setRow('row-note','modalNote', it.note);
  const photosDiv = document.getElementById('modalPhotos');
  if(it.images && it.images.length){
    photosDiv.className = 'modal-photos' + (it.images.length===1?' single':'');
    photosDiv.innerHTML = it.images.map(src=>`<img src="${src}">`).join('');
  } else {
    photosDiv.className = 'modal-photos';
    photosDiv.innerHTML = '';
  }
  document.getElementById('modalBg').classList.add('show');
}
document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('modalBg').classList.remove('show');
});
document.getElementById('modalBg').addEventListener('click', e=>{
  if(e.target.id==='modalBg') document.getElementById('modalBg').classList.remove('show');
});

function applyFilter(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = !q ? allItems : allItems.filter(it=>
    (it.name||'').toLowerCase().includes(q) ||
    (it.author||'').toLowerCase().includes(q) ||
    (it.era||'').toLowerCase().includes(q)
  );
  renderGrid(filtered);
}
document.getElementById('searchInput').addEventListener('input', applyFilter);

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-gallery').style.display = tab==='gallery' ? '' : 'none';
    document.getElementById('tab-add').style.display = tab==='add' ? '' : 'none';
  });
});

// ---- Storage helpers ----
// 三種模式：
// 1) window.storage 存在 -> 目前在 Claude 環境預覽，用 Claude 的雲端儲存
// 2) 有設定 API_URL -> 已串接 Google Apps Script，寫進 Google 試算表，大家看到同一份
// 3) 都沒有 -> 本機模式：新增的資料只存在目前這個分頁的記憶體裡，重新整理就會消失，
//    請務必用「匯出成 Excel」把資料下載保存
const STORAGE_PREFIX = 'chapot-item:';
const USE_CLOUD_API = !window.storage && API_URL && API_URL.startsWith('http');
const LOCAL_ONLY = !window.storage && !USE_CLOUD_API;
let localMemoryItems = [];

async function loadCustomItems(){
  if (window.storage) {
    try{
      const listRes = await window.storage.list(STORAGE_PREFIX, false);
      if(!listRes || !listRes.keys) return [];
      const items = [];
      for(const key of listRes.keys){
        try{
          const res = await window.storage.get(key, false);
          if(res && res.value){
            const parsed = JSON.parse(res.value);
            parsed._key = key;
            items.push(parsed);
          }
        }catch(e){ /* skip missing */ }
      }
      items.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      return items;
    }catch(e){
      console.error('loadCustomItems (storage) failed', e);
      return [];
    }
  }
  if (USE_CLOUD_API) {
    try{
      const res = await fetch(API_URL, { method:'GET' });
      const data = await res.json();
      const items = (data.items || []).map(it => ({...it, _key: it.id}));
      items.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      return items;
    }catch(e){
      console.error('loadCustomItems (cloud) failed', e);
      return [];
    }
  }
  // 本機模式：回傳目前記憶體裡的資料（重新整理頁面後會是空的）
  return localMemoryItems;
}

async function saveCustomItem(newItem){
  if (window.storage) {
    const key = STORAGE_PREFIX + Date.now();
    const res = await window.storage.set(key, JSON.stringify(newItem), false);
    if(!res) throw new Error('儲存失敗');
    newItem._key = key;
    return newItem;
  }
  if (USE_CLOUD_API) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(newItem)
    });
    const data = await res.json();
    if(!data || !data.success) throw new Error(data && data.error || '儲存失敗');
    newItem._key = data.id;
    return newItem;
  }
  // 本機模式：存進記憶體，不會持久保存
  newItem._key = 'local-' + Date.now();
  localMemoryItems.push(newItem);
  return newItem;
}

async function deleteCustomItem(key){
  if (window.storage) {
    await window.storage.delete(key, false);
    return;
  }
  if (USE_CLOUD_API) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', id:key })
    });
    const data = await res.json();
    if(!data || !data.success) throw new Error('刪除失敗');
    return;
  }
  // 本機模式
  localMemoryItems = localMemoryItems.filter(it=>it._key!==key);
}

function rebuildAllItems(){
  const seed = SEED_ITEMS.map(it=>({...it, uid:'seed-'+it.id, isCustom:false}));
  const maxSeedId = seed.reduce((m,it)=>Math.max(m,it.id||0),0);
  const custom = customItems.map((it,idx)=>({
    ...it,
    id: maxSeedId + idx + 1,
    uid: 'custom-'+(it._key||idx),
    isCustom: true
  }));
  allItems = [...seed, ...custom];
}

function renderManageList(){
  const box = document.getElementById('manageList');
  if(customItems.length===0){ box.innerHTML=''; return; }
  box.innerHTML = `<div style="font-family:var(--serif);color:var(--clay-deep);font-size:14px;margin:30px 0 10px;">已新增的藏品</div>` +
    customItems.map(it=>{
      const img = it.images && it.images[0];
      return `<div class="manage-item">
        ${img?`<img src="${img}">`:''}
        <div class="mi-name">${escapeHtml(it.name||'（未命名）')}</div>
        <button data-key="${it._key}">刪除</button>
      </div>`;
    }).join('');
  box.querySelectorAll('button[data-key]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = btn.dataset.key;
      if(!confirm('確定要刪除這筆新增資料嗎？')) return;
      try{
        await deleteCustomItem(key);
        customItems = customItems.filter(it=>it._key!==key);
        rebuildAllItems();
        renderManageList();
        applyFilter();
      }catch(e){ alert('刪除失敗，請再試一次'); }
    });
  });
}

async function init(){
  const statusEl = document.getElementById('cloudStatus');
  const exportHint = document.getElementById('exportHint');
  if (window.storage) {
    statusEl.textContent = '☁️ 雲端狀態：已連接 Claude 雲端儲存';
    statusEl.style.color = '#3d6b3a';
    exportHint.textContent = '也可以隨時把目前全部資料匯出成 Excel 備份。';
  } else if (USE_CLOUD_API) {
    statusEl.textContent = '☁️ 雲端狀態：已連接 Google Apps Script 資料庫';
    statusEl.style.color = '#3d6b3a';
    exportHint.textContent = '也可以隨時把目前全部資料匯出成 Excel 備份。';
  } else {
    statusEl.textContent = '📝 本機模式：新增的資料只會保留在目前這個分頁，重新整理或關閉頁面就會消失。';
    statusEl.style.color = 'var(--clay)';
    exportHint.textContent = '離開前記得點上面「匯出成 Excel」把資料下載保存！';
  }
  customItems = await loadCustomItems();
  rebuildAllItems();
  applyFilter();
  renderManageList();
}
init();

// ---- 匯出成 Excel ----
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const rows = allItems.map(it=>({
    '編號': it.id,
    '品名': it.name || '',
    '作者': it.author || '',
    '年代': it.era || '',
    '備註': it.note || '',
    '照片張數': (it.images && it.images.length) || 0,
    '來源': it.isCustom ? '新增' : '原始資料'
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:28},{wch:22},{wch:16},{wch:40},{wch:10},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '茶壺藏品');
  const ts = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `紫砂茶壺藏品錄_${ts}.xlsx`);
});

// ---- Add form ----
let pendingPhotos = []; // {dataUrl}

function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 320;
        let {width,height} = img;
        if(Math.max(width,height) > maxDim){
          const ratio = maxDim / Math.max(width,height);
          width = Math.round(width*ratio);
          height = Math.round(height*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const photoDrop = document.getElementById('photoDrop');
const photoInput = document.getElementById('f_photo');
photoDrop.addEventListener('click', ()=> photoInput.click());
photoDrop.addEventListener('dragover', e=>{ e.preventDefault(); photoDrop.style.borderColor='var(--clay)'; });
photoDrop.addEventListener('dragleave', ()=>{ photoDrop.style.borderColor=''; });
photoDrop.addEventListener('drop', e=>{
  e.preventDefault(); photoDrop.style.borderColor='';
  handleFiles(e.dataTransfer.files);
});
photoInput.addEventListener('change', ()=> handleFiles(photoInput.files));

async function handleFiles(fileList){
  const files = Array.from(fileList).slice(0, 2 - pendingPhotos.length);
  for(const file of files){
    if(!file.type.startsWith('image/')) continue;
    try{
      const dataUrl = await resizeImage(file);
      pendingPhotos.push(dataUrl);
    }catch(e){ console.error(e); }
  }
  renderPhotoPreview();
}

function renderPhotoPreview(){
  const box = document.getElementById('photoPreview');
  box.innerHTML = pendingPhotos.map((src,idx)=>`
    <div class="thumb">
      <img src="${src}">
      <button class="rm" type="button" data-idx="${idx}">✕</button>
    </div>`).join('');
  box.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingPhotos.splice(Number(btn.dataset.idx),1);
      renderPhotoPreview();
    });
  });
}

document.getElementById('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');
  const name = document.getElementById('f_name').value.trim();
  if(!name){ msg.textContent='請輸入品名'; msg.className='form-msg err'; return; }

  const newItem = {
    name,
    author: document.getElementById('f_author').value.trim(),
    era: document.getElementById('f_era').value.trim(),
    note: document.getElementById('f_note').value.trim(),
    images: pendingPhotos,
    createdAt: Date.now()
  };

  btn.disabled = true; msg.textContent='儲存中…'; msg.className='form-msg';
  try{
    const saved = await saveCustomItem(newItem);
    customItems.push(saved);
    rebuildAllItems();
    renderManageList();
    applyFilter();
    msg.textContent = '已加入藏品錄！'; msg.className='form-msg ok';
    document.getElementById('addForm').reset();
    pendingPhotos = [];
    renderPhotoPreview();
  }catch(err){
    console.error(err);
    msg.textContent = err.message || '儲存失敗，請稍後再試'; msg.className='form-msg err';
  }finally{
    btn.disabled = false;
  }
});
</script>
